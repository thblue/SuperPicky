[pytest]
# SuperPicky 测试配置：正式测试统一放在 tests/ 目录（含 tests/__init__.py，
# 使 pytest 以仓库根为 basedir，`from tools.xxx import` 可直接工作）。
# pythonpath=. 双保险：任何调用方式下仓库根都在 sys.path。
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    contract: 对外接口契约测试（守护 dev-docs/INTERFACE_CONTRACTS.md 冻结清单）
    qt: Qt 部件测试（QT_QPA_PLATFORM=offscreen 运行）
    db: 基于临时 SQLite 的数据库/集成测试
    smoke: 真权重端到端冒烟（本地资源不在位时自动 skip）
    slow: 长耗时测试
    local: 依赖本机真实数据/模型/网络的测试，CI 不执行
